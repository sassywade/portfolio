<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title description">
  <title id="title">Neel Saswade portfolio ASCII garden visual system</title>
  <desc id="description">Dark and light palettes, typography roles, glyph vocabulary, and a center-out scroll dissolve storyboard.</desc>
  <defs>
    <style>
      .serif { font-family: Newsreader, Georgia, serif; }
      .sans { font-family: Geist, Helvetica, Arial, sans-serif; }
      .mono { font-family: "Geist Mono", "SFMono-Regular", Consolas, monospace; }
      .label { font: 500 15px Geist, Helvetica, Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
      .caption { font: 400 17px Geist, Helvetica, Arial, sans-serif; }
      .code { font: 400 20px "Geist Mono", "SFMono-Regular", Consolas, monospace; }
    </style>
    <pattern id="darkGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2A302D" stroke-width="1"/>
    </pattern>
    <pattern id="lightGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#DED8C9" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1050" fill="#F4F0E6"/>
  <text x="70" y="78" class="serif" font-size="47" font-style="italic" fill="#292923">ASCII garden direction</text>
  <text x="70" y="114" class="sans" font-size="18" fill="#65655C">One living glyph system · Newsreader + Geist interface · paired dark and light modes</text>

  <g transform="translate(70 155)">
    <rect width="710" height="278" rx="22" fill="#121615"/>
    <rect width="710" height="278" rx="22" fill="url(#darkGrid)" opacity=".42"/>
    <text x="30" y="43" class="label" fill="#E9E1CD">Dark mode</text>
    <text x="30" y="83" class="serif" font-size="33" font-style="italic" fill="#EEE4CF">Neel Saswade</text>
    <text x="30" y="115" class="sans" font-size="17" fill="#E9E1CD">Geist keeps the portfolio readable and editorial.</text>
    <text x="30" y="145" class="mono" font-size="18" fill="#708BE8">bikes  photograph SF  backpacking</text>
    <text x="30" y="194" class="mono" font-size="19" fill="#B5B64E">···;,,__vYv····'·;__···</text>
    <text x="30" y="224" class="mono" font-size="19" fill="#C66E82">  Y      \|/      (o)   </text>
    <text x="30" y="254" class="mono" font-size="19" fill="#7FA5C7">     vvv       ;)_      </text>
  </g>

  <g transform="translate(820 155)">
    <rect width="710" height="278" rx="22" fill="#F7F2E7"/>
    <rect width="710" height="278" rx="22" fill="url(#lightGrid)" opacity=".72"/>
    <text x="30" y="43" class="label" fill="#292923">Light mode</text>
    <text x="30" y="83" class="serif" font-size="33" font-style="italic" fill="#302D27">Neel Saswade</text>
    <text x="30" y="115" class="sans" font-size="17" fill="#36342E">The same world, printed on warm botanical paper.</text>
    <text x="30" y="145" class="mono" font-size="18" fill="#3762CA">bikes  photograph SF  backpacking</text>
    <text x="30" y="194" class="mono" font-size="19" fill="#74752E">···;,,__vYv····'·;__···</text>
    <text x="30" y="224" class="mono" font-size="19" fill="#B45772">  Y      \|/      (o)   </text>
    <text x="30" y="254" class="mono" font-size="19" fill="#527D9A">     vvv       ;)_      </text>
  </g>

  <g transform="translate(70 475)">
    <text x="0" y="0" class="label" fill="#4B4A43">Shared palette</text>
    <g transform="translate(0 28)">
      <g transform="translate(0 0)"><rect width="160" height="78" rx="14" fill="#121615"/><text x="12" y="100" class="mono" font-size="13" fill="#5D5B52">#121615 charcoal</text></g>
      <g transform="translate(180 0)"><rect width="160" height="78" rx="14" fill="#F7F2E7" stroke="#D8D1C2"/><text x="12" y="100" class="mono" font-size="13" fill="#5D5B52">#F7F2E7 paper</text></g>
      <g transform="translate(360 0)"><rect width="160" height="78" rx="14" fill="#B5B64E"/><text x="12" y="100" class="mono" font-size="13" fill="#5D5B52">#B5B64E olive</text></g>
      <g transform="translate(540 0)"><rect width="160" height="78" rx="14" fill="#A96542"/><text x="12" y="100" class="mono" font-size="13" fill="#5D5B52">#A96542 rust</text></g>
      <g transform="translate(720 0)"><rect width="160" height="78" rx="14" fill="#C66E82"/><text x="12" y="100" class="mono" font-size="13" fill="#5D5B52">#C66E82 pink</text></g>
      <g transform="translate(900 0)"><rect width="160" height="78" rx="14" fill="#7FA5C7"/><text x="12" y="100" class="mono" font-size="13" fill="#5D5B52">#7FA5C7 cyan</text></g>
      <g transform="translate(1080 0)"><rect width="160" height="78" rx="14" fill="#708BE8"/><text x="12" y="100" class="mono" font-size="13" fill="#5D5B52">#708BE8 blue</text></g>
      <g transform="translate(1260 0)"><rect width="160" height="78" rx="14" fill="#D5C763"/><text x="12" y="100" class="mono" font-size="13" fill="#5D5B52">#D5C763 gold</text></g>
    </g>
  </g>

  <g transform="translate(70 645)">
    <text x="0" y="0" class="label" fill="#4B4A43">Glyph vocabulary</text>
    <text x="0" y="42" class="code" fill="#656629">Meadow     ·  :  ,  '  _  -  ;  ^  Y  V  /  \</text>
    <text x="0" y="78" class="code" fill="#875137">Tree       |  /  \  (  )  {  }  [  ]  U  V  W</text>
    <text x="0" y="114" class="code" fill="#B45772">Flowers    vYv   \|/   (o)   wYw   ^^^</text>
    <text x="0" y="150" class="code" fill="#527D9A">Creatures  ;)_   (·)   ~^~   ·°   ››</text>
    <text x="760" y="42" class="caption" fill="#44433D">Newsreader</text>
    <text x="920" y="42" class="serif" font-size="27" font-style="italic" fill="#302D27">Identity, headings, navigation</text>
    <text x="760" y="84" class="caption" fill="#44433D">Geist</text>
    <text x="920" y="84" class="sans" font-size="19" fill="#302D27">Body copy, links, controls, weather</text>
    <text x="760" y="126" class="caption" fill="#44433D">Geist Mono</text>
    <text x="920" y="126" class="mono" font-size="18" fill="#302D27">Scene glyphs and sprite frames only</text>
  </g>

  <g transform="translate(70 855)">
    <text x="0" y="0" class="label" fill="#4B4A43">Scroll behavior · center-out dissolve</text>
    <g transform="translate(0 28)">
      <g>
        <rect width="330" height="118" rx="14" fill="#121615"/>
        <path d="M0 70 Q78 51 164 72 T330 62 V118 H0Z" fill="#212616"/>
        <text x="14" y="24" class="mono" font-size="13" fill="#E9E1CD">00% · composed</text>
        <text x="20" y="92" class="mono" font-size="15" fill="#B5B64E">··;__vYv····;__Y····</text>
      </g>
      <g transform="translate(360 0)">
        <rect width="330" height="118" rx="14" fill="#121615"/>
        <path d="M0 70 Q78 51 164 72 T330 62 V118 H0Z" fill="#212616"/>
        <ellipse cx="165" cy="79" rx="44" ry="31" fill="#121615"/>
        <text x="14" y="24" class="mono" font-size="13" fill="#E9E1CD">35% · center opens</text>
        <text x="20" y="92" class="mono" font-size="15" fill="#B5B64E">··;__v       __Y····</text>
      </g>
      <g transform="translate(720 0)">
        <rect width="330" height="118" rx="14" fill="#121615"/>
        <path d="M0 70 Q78 51 164 72 T330 62 V118 H0Z" fill="#212616"/>
        <ellipse cx="165" cy="79" rx="104" ry="50" fill="#121615"/>
        <text x="14" y="24" class="mono" font-size="13" fill="#E9E1CD">68% · edges remain</text>
        <text x="20" y="92" class="mono" font-size="15" fill="#B5B64E">··;               ···</text>
      </g>
      <g transform="translate(1080 0)">
        <rect width="330" height="118" rx="14" fill="#121615"/>
        <text x="14" y="24" class="mono" font-size="13" fill="#E9E1CD">100% · quiet handoff</text>
        <text x="20" y="92" class="mono" font-size="15" fill="#B5B64E">·                     ·</text>
      </g>
    </g>
    <text x="0" y="173" class="sans" font-size="16" fill="#5B5A52">Glyphs disappear in a deterministic radial order with slight seeded irregularity. They never blur or shrink. Scrolling upward reconstructs the same scene exactly.</text>
  </g>
</svg>
